name: Python quality and tests

permissions:
  contents: read

on:
  push:
    branches: ["main", "research/**"]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: ${{ matrix.os }} / Python 3.13
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install project and quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Compile project
        run: python -m compileall -q src tests
      - name: Ruff lint
        run: ruff check src tests --output-format=github
      - name: Ruff format check
        run: ruff format --check src/paper_broker.py src/paper_trading_service.py
      - name: Lenient MyPy
        run: mypy src --ignore-missing-imports --follow-imports=silent --disable-error-code=attr-defined,assignment,arg-type,call-arg,return-value,var-annotated,misc,union-attr,index,operator,no-untyped-def
      - name: Run tests with coverage
        run: python -m pytest -q --cov=src --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.xml
          if-no-files-found: ignore
