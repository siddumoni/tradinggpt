name: Phase 5 format paper modules

on:
  push:
    branches: ["feature/phase5-repository-hygiene"]

permissions:
  contents: write

jobs:
  format:
    if: contains(github.event.head_commit.message, '[phase5-format]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/phase5-repository-hygiene
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Format paper broker and service
        run: ruff format src/paper_broker.py src/paper_trading_service.py
      - name: Commit formatting if changed
        run: |
          if git diff --quiet -- src/paper_broker.py src/paper_trading_service.py; then
            echo "Paper modules are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/paper_broker.py src/paper_trading_service.py
          git commit -m "Format paper broker and service for Phase 5"
          git push origin HEAD:feature/phase5-repository-hygiene
