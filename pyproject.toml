[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["reports", "data", ".local"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["F401", "F841", "E401", "E402", "E701", "E702"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = false
warn_unused_configs = true
disable_error_code = [
  "attr-defined",
  "assignment",
  "arg-type",
  "call-arg",
  "return-value",
  "var-annotated",
  "misc",
  "union-attr",
  "index",
  "operator",
  "no-untyped-def",
  "func-returns-value",
  "type-var",
]
